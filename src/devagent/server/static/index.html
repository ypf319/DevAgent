<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevAgent 代码智能助手</title>
    <style>
        /* 页面整体样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* 顶部标题栏 */
        .header {
            background: #2c3e50;
            color: white;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
        }
        /* 聊天消息区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        /* 消息气泡通用样式 */
        .message {
            margin-bottom: 20px;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        /* 用户消息 */
        .message.user {
            margin-left: auto;
            background: #3498db;
            color: white;
            border-bottom-right-radius: 4px;
        }
        /* 机器人消息 */
        .message.bot {
            margin-right: auto;
            background: white;
            color: #333;
            border: 1px solid #e4e7ed;
            border-bottom-left-radius: 4px;
        }
        /* 底部输入区域 */
        .input-area {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e4e7ed;
        }
        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        #queryInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        #queryInput:focus {
            border-color: #3498db;
        }
        #sendBtn {
            padding: 0 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #sendBtn:disabled {
            background: #909399;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- 顶部标题 -->
    <div class="header">
        🤖 DevAgent 代码仓库智能助手
    </div>

    <!-- 聊天消息区 -->
    <div class="chat-container" id="chatContainer">
        <div class="message bot">
            你好！我是你的代码仓库智能助手，你可以问我任何关于项目代码的问题。
        </div>
    </div>

    <!-- 底部输入区 -->
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="queryInput" placeholder="输入你的问题，按回车发送..." />
            <button id="sendBtn">发送</button>
        </div>
    </div>

    <script>
        // 获取页面元素
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        // 后端接口地址
        const API_URL = 'http://127.0.0.1:8000/api/chat';

        // 页面打开时生成一次会话 ID，后续请求都带上
        const SESSION_ID = 'web-' + Date.now();

        // 发送消息的函数
        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) return;

            // 1. 把用户消息加到页面上
            appendMessage(query, 'user');
            queryInput.value = '';
            sendBtn.disabled = true;

            // 2. 调用后端接口
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query, session_id: SESSION_ID })
                });
                const result = await response.json();

                // 3. 把机器人回答加到页面上
                if (result.code === 200) {
                    appendMessage(result.data.answer, 'bot');
                } else {
                    appendMessage('请求出错：' + result.message, 'bot');
                }
            } catch (error) {
                appendMessage('连接失败，请检查后端服务是否启动：' + error.message, 'bot');
            } finally {
                sendBtn.disabled = false;
                // 自动滚动到底部
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // 往聊天框追加消息
        function appendMessage(content, role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.textContent = content;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 绑定点击发送事件
        sendBtn.addEventListener('click', sendMessage);
        // 绑定回车发送事件
        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
